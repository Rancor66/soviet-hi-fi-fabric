plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'java'
}
version = '0.3.0'
group = 'ru.daniel.soviethifi'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
loom {
    runs {
        client {
            client()
            runDir 'run-client'
            programArgs '--username', 'HiFiFabric', '--width', '1280', '--height', '720'
            if (providers.gradleProperty('hifiJoin').isPresent()) programArgs '--quickPlayMultiplayer', '127.0.0.1:25577'
        }
        server { server(); runDir 'run-server'; programArgs '--nogui' }
        listener {
            client()
            runDir 'run-listener'
            programArgs '--username', 'HiFiListener', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', '127.0.0.1:25577'
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    exclude 'META-INF/mods.toml'
}
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'soviet_hifi_tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
